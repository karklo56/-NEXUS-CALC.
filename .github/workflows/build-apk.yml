
name: Build NEXUS CALC APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          unzip -q NEXUS_CALC_Android_Project.zip -d source
          test -d source/NexusCalc
          
      - name: Align Java and Kotlin JVM targets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("source/NexusCalc/app/build.gradle.kts")
          s = p.read_text()
          marker = "    compileSdk = 35\n"

          if marker not in s:
              raise SystemExit("compileSdk line not found")

          addition = """    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

          """

          s = s.replace(marker, marker + addition, 1)
          p.write_text(s)
          print("Java e Kotlin configurados para JVM 17.")
          PY

      
      - name: Fix Kotlin source errors
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("source/NexusCalc/app/src/main/java/com/nexuscalc/app/MainActivity.kt")
          s = p.read_text()

          old1 = "cornerRadius = dp(radius).toFloat()"
          new1 = "cornerRadius = dp(radius.toInt()).toFloat()"
          old2 = "singleLine = false"
          new2 = "setSingleLine(false)"

          if old1 in s:
              s = s.replace(old1, new1, 1)
          elif new1 not in s:
              raise SystemExit("Não encontrei a expressão cornerRadius esperada.")

          if old2 in s:
              s = s.replace(old2, new2, 1)
          elif new2 not in s:
              raise SystemExit("Não encontrei a expressão singleLine esperada.")

          p.write_text(s)
          print("As duas correções Kotlin foram verificadas!")
          PY
          
          
      - name: Build debug APK
        working-directory: source/NexusCalc
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-CALC-APK
          path: source/NexusCalc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
